name: Ejecutar Agente de IA Diario

on:
  schedule:
    # Corre todos los días a las 13:00 UTC (Ajusta según tu zona horaria)
    - cron: '0 13 * * *'
  workflow_dispatch: # Esto te permite activar el agente manualmente desde la web de GitHub

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar el script del Agente
      env:
        # Aquí conectamos las variables que usará Python con los secretos seguros de GitHub
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        MI_CORREO: ${{ secrets.MI_CORREO }}
        MI_APP_PASSWORD: ${{ secrets.MI_APP_PASSWORD }}
      run: python main.py